# Argus: allow binding to an address the host does not hold yet.
#
# NETBOX_BIND / ARGUS_WEB_BIND in deploy/.env usually name an overlay address
# (NetBird, Tailscale, WireGuard). At boot Docker restores the stack before that
# interface has its address, the publish bind fails with "cannot assign
# requested address", and the container is left in a state only a recreate
# fixes (see argus.service). With this setting the bind succeeds; traffic
# reaches the socket once the address appears. Verified 2026-09-22 on Docker
# 29.6.2: `docker run -p 100.64.99.99:9999:6379 ...` with an address the host
# does not have fails with the sysctl at 0 and publishes (DNAT rule plus
# docker-proxy listener) at 1.
#
# Install:  sudo install -m 0644 90-argus-nonlocal-bind.conf /etc/sysctl.d/
#           sudo sysctl -p /etc/sysctl.d/90-argus-nonlocal-bind.conf
net.ipv4.ip_nonlocal_bind = 1
