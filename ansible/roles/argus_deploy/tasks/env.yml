---
# Render deploy/.env. Secrets are generated once and reused from the existing file, and every
# key this role does not manage is carried over verbatim, so a re-run never drops a
# host-specific setting (bind addresses, collector credentials, ...) that was added by hand.
- name: Read existing deploy/.env (to reuse secrets and carry over unmanaged keys)
  ansible.builtin.slurp:
    src: "{{ argus_dest }}/deploy/.env"
  register: argus_env_raw
  failed_when: false
  changed_when: false

- name: Parse existing deploy/.env
  ansible.builtin.set_fact:
    argus_existing: >-
      {{ dict((argus_env_raw.content | b64decode) | regex_findall('(?m)^([A-Z0-9_]+)=(.*)$'))
         if (argus_env_raw.content is defined) else {} }}

# Secrets are generated once and then reused from the existing .env, so re-running this
# role never rotates them (which would break the NetBox DB / API token). Optional values
# fall back to the existing file when their role variable is blank.
- name: Resolve deploy/.env values this role manages
  ansible.builtin.set_fact:
    argus_env:
      NETBOX_IMAGE: "{{ argus_netbox_image }}"
      NETBOX_SECRET_KEY: "{{ argus_existing.NETBOX_SECRET_KEY | default(lookup('ansible.builtin.password', '/dev/null length=50 chars=ascii_letters,digits')) }}"
      POSTGRES_PASSWORD: "{{ argus_existing.POSTGRES_PASSWORD | default(lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits')) }}"
      NETBOX_SUPERUSER_PASSWORD: "{{ argus_existing.NETBOX_SUPERUSER_PASSWORD | default(lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits')) }}"
      NETBOX_API_TOKEN: "{{ argus_existing.NETBOX_API_TOKEN | default(lookup('ansible.builtin.password', '/dev/null length=40 chars=ascii_lowercase,digits')) }}"
      # NetBox 4.5+ hashes v2 API tokens with this server-side pepper. It must stay stable
      # once tokens exist, so it is generated once and reused like the other secrets.
      NETBOX_API_TOKEN_PEPPER_1: "{{ argus_existing.NETBOX_API_TOKEN_PEPPER_1 | default(lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits')) }}"
      NETBOX_BIND: "{{ argus_netbox_bind or (argus_existing.NETBOX_BIND | default('')) }}"
      ARGUS_WEB_BIND: "{{ argus_web_bind or (argus_existing.ARGUS_WEB_BIND | default('')) }}"
      UNIFI_URL: "{{ argus_unifi_url or (argus_existing.UNIFI_URL | default('')) }}"
      UNIFI_API_TOKEN: "{{ argus_unifi_api_token or (argus_existing.UNIFI_API_TOKEN | default('')) }}"
      UNIFI_SITE: "{{ argus_unifi_site or (argus_existing.UNIFI_SITE | default('default')) }}"
      NETBOX_CSRF_TRUSTED_ORIGINS: "{{ argus_netbox_csrf_trusted_origins or (argus_existing.NETBOX_CSRF_TRUSTED_ORIGINS | default('')) }}"
      HTTP_TOKEN: "{{ argus_http_token or (argus_existing.HTTP_TOKEN | default('')) }}"
      NETBOX_WEBHOOK_SECRET: "{{ argus_netbox_webhook_secret or (argus_existing.NETBOX_WEBHOOK_SECRET | default('')) }}"
      SCHEDULE_INTERVAL: "{{ argus_schedule_interval or (argus_existing.SCHEDULE_INTERVAL | default('0')) }}"
      SCHEDULE_COLLECTOR: "{{ argus_schedule_collector or (argus_existing.SCHEDULE_COLLECTOR | default('unifi')) }}"
      ALERT_WEBHOOK_URL: "{{ argus_alert_webhook_url or (argus_existing.ALERT_WEBHOOK_URL | default('')) }}"
      MNEMOSYNE_URL: "{{ argus_mnemosyne_url or (argus_existing.MNEMOSYNE_URL | default('')) }}"
      NETBOX_OIDC_CLIENT_ID: "{{ argus_netbox_oidc_client_id or (argus_existing.NETBOX_OIDC_CLIENT_ID | default('')) }}"
      NETBOX_OIDC_CLIENT_SECRET: "{{ argus_netbox_oidc_client_secret or (argus_existing.NETBOX_OIDC_CLIENT_SECRET | default('')) }}"
      NETBOX_OIDC_ENDPOINT: "{{ argus_netbox_oidc_endpoint or (argus_existing.NETBOX_OIDC_ENDPOINT | default('')) }}"
      NETBOX_OIDC_DEFAULT_GROUPS: "{{ argus_netbox_oidc_default_groups or (argus_existing.NETBOX_OIDC_DEFAULT_GROUPS | default('')) }}"

# Anything else in the existing file (NetBird, firewall and Docker collector settings,
# ARGUS_SSH_DIR, hand-added keys) is rendered back unchanged below the managed block.
- name: Carry over keys from the existing deploy/.env that this role does not manage
  ansible.builtin.set_fact:
    argus_env_passthrough: >-
      {{ argus_existing | dict2items | rejectattr('key', 'in', argus_env) | items2dict }}

- name: Render deploy/.env
  ansible.builtin.template:
    src: env.j2
    dest: "{{ argus_dest }}/deploy/.env"
    mode: "0600"
  no_log: "{{ argus_env_no_log | bool }}"
  notify: Recreate Argus stack
