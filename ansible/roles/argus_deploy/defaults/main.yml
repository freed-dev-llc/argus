---
# Where the Argus repo lives on the target, and whether this role manages it via git.
argus_repo_url: "https://github.com/freed-dev-llc/argus.git"
argus_version: "main"
argus_dest: "{{ ansible_user_dir }}/argus"
argus_manage_repo: true

# NetBox image (pin as desired).
argus_netbox_image: "netboxcommunity/netbox:v4.6-5.0.1"

# UniFi discovery source. Leave blank to reuse whatever is already in the target's
# deploy/.env (so re-runs don't wipe creds); set via group_vars / Ansible Vault to manage them.
argus_unifi_url: ""
argus_unifi_api_token: ""
argus_unifi_site: "default"

# Optional: trusted https origin(s) for NetBox's CSRF check when the UI is served over HTTPS
# behind a reverse proxy / tunnel (e.g. "https://netbox.example.com"; space-separated for
# several). Blank reuses whatever is already in the target's deploy/.env, so a manual edit on
# the host is preserved. See deploy/README.md for the Cloudflare Tunnel walkthrough.
argus_netbox_csrf_trusted_origins: ""

# Optional Argus server features. Blank reuses whatever is already in the target's
# deploy/.env (so a manual edit on the host survives re-runs); set here / via Vault to
# manage them. SCHEDULE_INTERVAL/COLLECTOR fall back to the compose defaults (0 / unifi).
argus_http_token: ""              # bearer token for /api + /webhooks; blank = open
argus_netbox_webhook_secret: ""   # NetBox webhook HMAC secret (server-only); blank = off
argus_schedule_interval: ""       # seconds between drift cycles; 0/blank disables
argus_schedule_collector: ""      # collector the scheduled drift cycle observes
argus_alert_webhook_url: ""       # Slack-compatible webhook; alerts on drift when set
argus_mnemosyne_url: ""           # mnemosyne-http base URL for "Ask the Brain"; blank = disabled

# Bind addresses for the NetBox UI (:8096) and the dashboard (:8095). Blank reuses the
# target's existing deploy/.env; the compose default is 0.0.0.0 (every interface). Set a
# host's mesh address (NetBird/Tailscale/WireGuard) to keep both off the LAN, and install
# deploy/argus.service on that host so the bindings survive reboots.
argus_netbox_bind: ""
argus_web_bind: ""

# NetBox OpenID Connect remote auth (Authentik or any OIDC issuer). Blank reuses the
# target's existing deploy/.env; with any of the three required keys unset, NetBox stays on
# local authentication. Keep the secret in Ansible Vault.
argus_netbox_oidc_client_id: ""
argus_netbox_oidc_client_secret: ""
argus_netbox_oidc_endpoint: ""
argus_netbox_oidc_default_groups: ""

# Set false to render deploy/.env and stop: no compose up and no recreate handler.
# playbooks/argus-env-render-check.yml uses this to exercise the template on localhost.
argus_manage_stack: true

# PATH for the docker CLI on the target (OrbStack/Docker Desktop on macOS aren't on the
# default non-login PATH). Adjust for Linux hosts if needed.
argus_docker_path: "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"
