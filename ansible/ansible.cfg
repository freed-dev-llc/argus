[defaults]
# Static deploy inventory (gitignored; copy inventory/hosts.example.yml) first, then the
# NetBox dynamic inventory. A missing source only warns, so a fresh clone still works.
inventory = ./inventory/hosts.yml,./netbox_inventory.yml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False

[inventory]
# Standard static-inventory plugins (for deploy hosts.yml) + the NetBox dynamic plugin.
enable_plugins = host_list, yaml, ini, auto, netbox.netbox.nb_inventory
