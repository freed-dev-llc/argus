[defaults]
# Default inventory: the static deploy inventory (gitignored; copy inventory/hosts.example.yml).
# A missing file only warns, so a fresh clone still works. The NetBox dynamic inventory is
# opt-in (-i netbox_inventory.yml) because it needs NETBOX_API and NETBOX_TOKEN exported;
# as a default source it warned on every deploy run that lacked them.
inventory = ./inventory/hosts.yml
roles_path = ./roles
host_key_checking = False
retry_files_enabled = False

[inventory]
# Standard static-inventory plugins (for deploy hosts.yml) + the NetBox dynamic plugin.
enable_plugins = host_list, yaml, ini, auto, netbox.netbox.nb_inventory
