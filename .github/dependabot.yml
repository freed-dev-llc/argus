version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      python-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    # Frontend toolchain majors are deferred, but for three different reasons — they are
    # NOT one blocked bundle. Tracking issue: #175.
    #   typescript 7        — genuinely blocked: typescript-eslint peer-caps TS at
    #                         `>=4.8.4 <6.1.0` (8.67.x, alphas included). Unblock check:
    #                         `npm view typescript-eslint peerDependencies.typescript`.
    #   eslint / @eslint/js — no longer blocked (typescript-eslint 8.67.0 peers
    #                         `eslint: ^8.57.0 || ^9.0.0 || ^10.0.0`); held only because
    #                         eslint 10 wants a deliberate flat-config pass.
    #   vite / plugin-react — independent of typescript-eslint; plugin-react 6 peers
    #                         `vite: ^8.0.0`, so the pair moves together. vite 8 is
    #                         Rolldown-based — a migration, not a bump.
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
