# Argus label definitions, synced by .github/workflows/label-sync.yml.
# Sync is additive only: labels not listed here are left untouched.

# GitHub defaults
- name: bug
  color: "d73a4a"
  description: Something isn't working

- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists

- name: enhancement
  color: "a2eeef"
  description: New feature or request

- name: good first issue
  color: "7057ff"
  description: Good for newcomers

- name: help wanted
  color: "008672"
  description: Extra attention is needed

- name: invalid
  color: "e4e669"
  description: This doesn't seem right

- name: question
  color: "d876e3"
  description: Further information is requested

- name: wontfix
  color: "ffffff"
  description: This will not be worked on

# House set
- name: dependencies
  color: "0366d6"
  description: Dependency updates

- name: github-actions
  color: "2088FF"
  description: CI workflows

- name: architecture
  color: "8B5CF6"
  description: Architecture / design decisions

- name: epic
  color: "3E4B9E"
  description: Epic tracking issue

- name: security
  color: "D93F0B"
  description: Security-related issues

- name: "status: in-progress"
  color: "ffd700"
  description: Currently being worked on

- name: "status: complete"
  color: "28a745"
  description: Task/Feature complete

- name: priority/high
  color: "B60205"
  description: High priority

- name: priority/medium
  color: "FBCA04"
  description: Medium priority

- name: priority/low
  color: "0E8A16"
  description: Low priority

# Language tags (pre-existing)
- name: javascript
  color: "f1e05a"
  description: JS / TS / web

- name: python
  color: "3572A5"
  description: Python / server
